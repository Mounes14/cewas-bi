<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDS Score Wheel</title>
<style>
  :root {
    --ink: #002C73; --ink-2: #2C4179; --muted: #5B6B8C; --line: #D5DEEA;
    --surface: #FFFFFF; --page: #F4F8FC; --track: #EEF3F8;
    --good: #1E7B4F; --bad: #B03A2E;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #E6EEF9; --ink-2: #BFD0EA; --muted: #92A3BF; --line: #2A3A55;
      --surface: #111B2E; --page: #0B1424; --track: #1A2740;
      --good: #6FD39E; --bad: #F08A7E;
    }
  }
  :root[data-theme="dark"] {
    --ink: #E6EEF9; --ink-2: #BFD0EA; --muted: #92A3BF; --line: #2A3A55;
    --surface: #111B2E; --page: #0B1424; --track: #1A2740;
    --good: #6FD39E; --bad: #F08A7E;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
         font-family: Aptos, Calibri, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
  header h1 { font-size: 24px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; margin-top: 18px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  svg { width: 100%; height: auto; display: block; }
  .arc { stroke: var(--surface); stroke-width: 2; cursor: default; transition: opacity .15s; }
  .dim .arc { opacity: .35; } .dim .arc.on { opacity: 1; }
  .lbl { pointer-events: none; font-size: 11px; }
  .lbl.seg { font-size: 13px; font-weight: 700; }
  .lbl.area { font-size: 11.5px; font-weight: 600; }
  .center-num { font-size: 46px; font-weight: 700; fill: var(--ink); }
  .center-sub { font-size: 12px; fill: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 10px; font-size: 13px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .scale { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .scale .bar { height: 10px; width: 160px; border-radius: 5px;
                background: linear-gradient(90deg, #E3EAF3, #002C73); }
  h2 { font-size: 16px; margin: 0 0 10px; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .kpi b { display: block; font-size: 24px; }
  .kpi small { color: var(--muted); }
  .seglist div { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 8px; align-items: center;
                 padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .delta.up { color: var(--good); } .delta.down { color: var(--bad); } .delta { font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
  .note { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.45; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.l1 td { font-weight: 700; } tr.l2 td:first-child { padding-left: 22px; font-weight: 600; } tr.l3 td:first-child { padding-left: 40px; }
  .mini { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; min-width: 90px; }
  .mini i { display: block; height: 100%; border-radius: 4px; }
  #tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
         border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,.15); display: none; max-width: 280px; }
  #tip b { display: block; font-size: 13.5px; margin-bottom: 2px; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </header>
  <div class="layout">
    <div class="card">
      <svg id="wheel" viewBox="-470 -470 940 940" role="img" aria-labelledby="title"></svg>
      <div class="legend" id="legend"></div>
      <div class="scale">Score: <span>0%</span><span class="bar"></span><span>100%</span> · darker = higher score · slice size = number of scored questions</div>
    </div>
    <div class="card">
      <h2>Summary</h2>
      <div class="kpis" id="kpis"></div>
      <div class="seglist" id="seglist"></div>
      <p class="note" id="notes"></p>
    </div>
  </div>
  <div class="card" style="margin-top:20px">
    <h2>All sections</h2>
    <div class="table-wrap"><table id="tbl"></table></div>
  </div>
</main>
<div id="tip"></div>
<script id="eds-data" type="application/json">/*DATA*/</script>
<script>
const D = JSON.parse(document.getElementById('eds-data').textContent);
const SEG_COLORS = ['#002C73', '#375B92', '#4F86B8', '#5E9A82', '#024C27'];  // cewas blues + greens
const fmt = v => v == null ? '–' : (Math.round(v * 10) / 10).toString().replace(/\.0$/, '') + '%';
const NS = 'http://www.w3.org/2000/svg';

// --- build tree (segment > area > topic) from topic rows ------------------
// Static EDS structure (question_map order). D.rows = [[o, score, compare_score, unscored], ...] from chart_query.dax
const SECTIONS = [{"o": 1, "level": "Segment", "name": "Proof of Business Concept", "weight": 0, "questions": 0}, {"o": 2, "level": "Area", "name": "Market potential", "weight": 0, "questions": 0}, {"o": 3, "level": "Topic", "name": "Customer Segmentation", "weight": 2.0, "questions": 2}, {"o": 4, "level": "Topic", "name": "Market size", "weight": 4.0, "questions": 4}, {"o": 5, "level": "Topic", "name": "Positioning", "weight": 3.0, "questions": 3}, {"o": 6, "level": "Topic", "name": "Pricing", "weight": 2.0, "questions": 2}, {"o": 7, "level": "Topic", "name": "Marketing resources", "weight": 3.0, "questions": 3}, {"o": 8, "level": "Area", "name": "Revenue generation", "weight": 0, "questions": 0}, {"o": 9, "level": "Topic", "name": "Sales track record", "weight": 4.0, "questions": 4}, {"o": 10, "level": "Topic", "name": "Profitability", "weight": 3.0, "questions": 3}, {"o": 11, "level": "Segment", "name": "Market Success through Innovation", "weight": 0, "questions": 0}, {"o": 12, "level": "Area", "name": "Business model innovation", "weight": 0, "questions": 0}, {"o": 13, "level": "Topic", "name": "Unique positioning", "weight": 4.0, "questions": 4}, {"o": 14, "level": "Topic", "name": "Scalability", "weight": 2.0, "questions": 2}, {"o": 15, "level": "Area", "name": "Product innovation", "weight": 0, "questions": 0}, {"o": 16, "level": "Topic", "name": "Solving sector challenges", "weight": 2.0, "questions": 2}, {"o": 17, "level": "Area", "name": "Process innovation", "weight": 0, "questions": 0}, {"o": 18, "level": "Topic", "name": "Optimizing internal processes", "weight": 2.0, "questions": 2}, {"o": 19, "level": "Topic", "name": "Letting others do the work", "weight": 2.0, "questions": 2}, {"o": 20, "level": "Segment", "name": "Management and Financing", "weight": 0, "questions": 0}, {"o": 21, "level": "Area", "name": "Operational and strategic planning", "weight": 0, "questions": 0}, {"o": 22, "level": "Topic", "name": "Business plan & KPIs", "weight": 3.0, "questions": 3}, {"o": 23, "level": "Topic", "name": "Risk management", "weight": 3.0, "questions": 3}, {"o": 24, "level": "Area", "name": "Financial management", "weight": 0, "questions": 0}, {"o": 25, "level": "Topic", "name": "Financial management", "weight": 2.0, "questions": 2}, {"o": 26, "level": "Topic", "name": "Evidence", "weight": 2.0, "questions": 2}, {"o": 27, "level": "Area", "name": "Investments", "weight": 0, "questions": 0}, {"o": 28, "level": "Topic", "name": "Investment track record", "weight": 6.0, "questions": 6}, {"o": 29, "level": "Topic", "name": "Investment needs and options", "weight": 4.0, "questions": 4}, {"o": 30, "level": "Segment", "name": "Capacity to deliver", "weight": 0, "questions": 0}, {"o": 31, "level": "Area", "name": "Team composition", "weight": 0, "questions": 0}, {"o": 32, "level": "Topic", "name": "Capacity of founders", "weight": 4.0, "questions": 4}, {"o": 33, "level": "Topic", "name": "Team experience", "weight": 7.0, "questions": 7}, {"o": 34, "level": "Topic", "name": "Support network", "weight": 1.0, "questions": 1}, {"o": 35, "level": "Area", "name": "Operational capacity", "weight": 0, "questions": 0}, {"o": 36, "level": "Topic", "name": "Supply chain management", "weight": 2.0, "questions": 2}, {"o": 37, "level": "Topic", "name": "Production and delivery resources", "weight": 3.0, "questions": 3}, {"o": 38, "level": "Area", "name": "Governance", "weight": 0, "questions": 0}, {"o": 39, "level": "Topic", "name": "Legal setup and compliance", "weight": 2.0, "questions": 2}, {"o": 40, "level": "Topic", "name": "HR Management", "weight": 4.0, "questions": 4}, {"o": 41, "level": "Segment", "name": "Impact Potential", "weight": 0, "questions": 0}, {"o": 42, "level": "Area", "name": "What impact", "weight": 0, "questions": 0}, {"o": 43, "level": "Topic", "name": "Status and type of contribution", "weight": 2.0, "questions": 2}, {"o": 44, "level": "Topic", "name": "Impact management", "weight": 5.0, "questions": 5}, {"o": 45, "level": "Area", "name": "How much impact", "weight": 0, "questions": 0}, {"o": 46, "level": "Topic", "name": "Who benefits", "weight": 3.0, "questions": 3}, {"o": 47, "level": "Topic", "name": "Societal impact", "weight": 6.0, "questions": 6}, {"o": 48, "level": "Topic", "name": "Core impact: WASH", "weight": 8.0, "questions": 8}, {"o": 49, "level": "Topic", "name": "Core impact: Waste & Sustainable agriculture", "weight": 4.3, "questions": 5}, {"o": 50, "level": "Topic", "name": "Climate impact", "weight": 1.0, "questions": 1}, {"o": 51, "level": "Area", "name": "Impact risk", "weight": 0, "questions": 0}, {"o": 52, "level": "Topic", "name": "Impact reliability", "weight": 2.0, "questions": 2}, {"o": 53, "level": "Topic", "name": "Impact sustainability", "weight": 4.0, "questions": 4}];
if (!D.nodes) {
  const byO = Object.fromEntries((D.rows || []).map(r => [r[0], r]));
  D.nodes = SECTIONS.map(m => { const r = byO[m.o] || []; return { ...m, score: r[1] ?? null, prev: r[2] ?? null, unscored: r[3] || 0 }; });
}
const segs = [];
for (const n of D.nodes) {
  // a topic with no rated question yet reads "not scored" ("–"), never 0%
  if (n.level === 'Topic' && n.questions && n.unscored >= n.questions) n.score = null;
  if (n.level === 'Segment') segs.push({ ...n, kids: [] });
  else if (n.level === 'Area') segs.at(-1).kids.push({ ...n, kids: [] });
  else segs.at(-1).kids.at(-1).kids.push({ ...n });
}
segs.forEach((s, i) => { s.color = SEG_COLORS[i % SEG_COLORS.length]; });
const wSum = n => n.kids ? (n.w = n.kids.reduce((a, k) => a + wSum(k), 0)) : (n.w = Math.max(n.weight || 1, 0.5));
segs.forEach(wSum);
const total = segs.reduce((a, s) => a + s.w, 0);

// --- colour: segment hue mixed toward pale by score -----------------------
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(hex, t) {               // t = 0 -> pale, 1 -> full hue
  const [r, g, b] = hex2rgb(hex), p = [234, 240, 247];
  const c = [r, g, b].map((v, i) => Math.round(p[i] + (v - p[i]) * (0.12 + 0.88 * t)));
  return { fill: `rgb(${c})`, lum: (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255 };
}

// --- geometry --------------------------------------------------------------
const R = [[120, 205], [207, 290], [292, 455]];
const pol = (r, a) => [r * Math.sin(a), -r * Math.cos(a)];
function arcPath(r0, r1, a0, a1) {
  const big = a1 - a0 > Math.PI ? 1 : 0, [x0, y0] = pol(r1, a0), [x1, y1] = pol(r1, a1), [x2, y2] = pol(r0, a1), [x3, y3] = pol(r0, a0);
  return `M${x0},${y0}A${r1},${r1} 0 ${big} 1 ${x1},${y1}L${x2},${y2}A${r0},${r0} 0 ${big} 0 ${x3},${y3}Z`;
}
const svg = document.getElementById('wheel');
const gArcs = document.createElementNS(NS, 'g'), gLbl = document.createElementNS(NS, 'g');
svg.append(gArcs, gLbl);
const tip = document.getElementById('tip');
const all = [];

function addArc(node, depth, a0, a1, seg, path) {
  const [r0, r1] = R[depth];
  const sc = node.score == null ? 0 : node.score / 100;
  const col = mix(seg.color, sc);
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', arcPath(r0, r1, a0 + 0.002, a1 - 0.002));
  p.setAttribute('fill', node.score == null ? 'var(--track)' : col.fill);
  p.setAttribute('class', 'arc');
  p.dataset.path = path;
  gArcs.append(p); all.push(p);
  p.addEventListener('mousemove', e => {
    const dl = node.prev == null || node.score == null ? '' :
      `<br>vs ${D.compare_label}: ${fmt(node.prev)} (${node.score - node.prev >= 0 ? '+' : ''}${(Math.round((node.score - node.prev) * 10) / 10)} pts)`;
    tip.innerHTML = `<b>${node.name}</b>${node.level} · ${seg.name}<br>Score: <strong>${fmt(node.score)}</strong>${dl}` +
      (node.unscored ? `<br><em>${node.unscored} question(s) not yet scored</em>` : '');
    tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX + 14, innerWidth - 300) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
    svg.classList.add('dim'); all.forEach(x => x.classList.toggle('on', path.startsWith(x.dataset.path) || x.dataset.path.startsWith(path)));
  });
  p.addEventListener('mouseleave', () => { tip.style.display = 'none'; svg.classList.remove('dim'); });

  // label
  const mid = (a0 + a1) / 2, span = a1 - a0, txtCol = col.lum < 0.55 && node.score != null ? '#FFFFFF' : '#002C73';
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('class', 'lbl ' + ['seg', 'area', 'topic'][depth]);
  t.setAttribute('fill', txtCol);
  const deg = mid * 180 / Math.PI;
  if (depth === 2) {                       // radial label in outer ring
    const rr = (r0 + r1) / 2, [x, y] = pol(rr, mid), flip = deg > 180;
    t.setAttribute('transform', `translate(${x},${y}) rotate(${flip ? deg + 90 : deg - 90})`);
    t.setAttribute('text-anchor', 'middle'); t.setAttribute('dominant-baseline', 'middle');
    const maxCh = 22, nm = node.name.length > maxCh ? node.name.slice(0, maxCh - 1) + '…' : node.name;
    if (span * rr < 11) return;            // too thin to label: tooltip + table cover it
    t.innerHTML = `<tspan font-weight="700">${fmt(node.score)}</tspan><tspan dx="6">${nm}</tspan>`;
  } else {                                 // tangential, two lines: name + score
    const rr = (r0 + r1) / 2, [x, y] = pol(rr, mid);
    let rot = deg; if (deg > 90 && deg < 270) rot = deg - 180;
    t.setAttribute('transform', `translate(${x},${y}) rotate(${rot})`);
    t.setAttribute('text-anchor', 'middle');
    const room = span * rr, maxCh = Math.max(4, Math.floor(room / (depth === 0 ? 8 : 7)));
    const nm = node.name.length > maxCh ? node.name.slice(0, maxCh - 1) + '…' : node.name;
    if (room < 26) return;
    t.innerHTML = `<tspan x="0" dy="-0.2em">${nm}</tspan><tspan x="0" dy="1.25em" font-weight="700">${fmt(node.score)}</tspan>`;
  }
  gLbl.append(t);
}

let a = 0;
for (const s of segs) {
  const sa = a, sw = s.w / total * 2 * Math.PI;
  addArc(s, 0, sa, sa + sw, s, s.name);
  let b = sa;
  for (const ar of s.kids) {
    const aw = ar.w / total * 2 * Math.PI;
    addArc(ar, 1, b, b + aw, s, s.name + '>' + ar.name);
    let c = b;
    for (const tp of ar.kids) {
      const tw = tp.w / total * 2 * Math.PI;
      addArc(tp, 2, c, c + tw, s, s.name + '>' + ar.name + '>' + tp.name);
      c += tw;
    }
    b += aw;
  }
  a += sw;
}
// centre
const cn = document.createElementNS(NS, 'text');
cn.setAttribute('class', 'center-num'); cn.setAttribute('text-anchor', 'middle'); cn.setAttribute('y', 8);
cn.textContent = fmt(D.total);
const cs = document.createElementNS(NS, 'text');
cs.setAttribute('class', 'center-sub'); cs.setAttribute('text-anchor', 'middle'); cs.setAttribute('y', 34);
cs.textContent = 'EDS total score';
svg.append(cn, cs);

// --- header, legend, summary ---------------------------------------------
document.getElementById('title').textContent = `${D.enterprise} — ${D.status} survey`;
document.getElementById('subtitle').textContent = [D.program, D.country, D.date ? 'Survey date ' + D.date : '', D.rated_by ? 'Rated by ' + D.rated_by : ''].filter(Boolean).join(' · ');
document.getElementById('legend').innerHTML = segs.map(s => `<span><i class="sw" style="background:${s.color}"></i>${s.name}</span>`).join('');
const dHtml = (cur, prev) => {
  if (cur == null || prev == null) return '<span class="delta">–</span>';
  const d = Math.round((cur - prev) * 10) / 10;
  return `<span class="delta ${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${d > 0 ? '▲ +' : d < 0 ? '▼ ' : ''}${d} pts</span>`;
};
document.getElementById('kpis').innerHTML =
  `<div class="kpi"><small>${D.status} total</small><b>${fmt(D.total)}</b></div>` +
  `<div class="kpi"><small>${D.compare_label || 'Comparison'} total</small><b>${fmt(D.compare_total)}</b>${dHtml(D.total, D.compare_total)}</div>`;
document.getElementById('seglist').innerHTML = segs.map(s =>
  `<div><i class="sw" style="background:${s.color}"></i><span>${s.name}</span><strong>${fmt(s.score)}</strong>${dHtml(s.score, s.prev)}</div>`).join('');
document.getElementById('notes').innerHTML = (D.notes || []).join('<br>');

// --- table view ------------------------------------------------------------
const rows = [];
for (const s of segs) { rows.push([1, s, s]); for (const ar of s.kids) { rows.push([2, ar, s]); for (const tp of ar.kids) rows.push([3, tp, s]); } }
document.getElementById('tbl').innerHTML =
  `<tr><th>Section</th><th class="num">${D.status}</th><th></th><th class="num">${D.compare_label || ''}</th><th class="num">Change</th></tr>` +
  rows.map(([l, n, s]) => `<tr class="l${l}"><td>${n.name}${n.unscored ? ' <small style="color:var(--muted)">(' + n.unscored + ' unscored)</small>' : ''}</td>` +
    `<td class="num">${fmt(n.score)}</td><td><div class="mini"><i style="width:${n.score || 0}%;background:${s.color}"></i></div></td>` +
    `<td class="num">${fmt(n.prev)}</td><td class="num">${dHtml(n.score, n.prev)}</td></tr>`).join('');
</script>
</body>
</html>
